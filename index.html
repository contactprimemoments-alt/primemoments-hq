<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5A3E2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PM HQ">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/hq-192.png">
<link rel="apple-touch-icon" href="icons/hq-180.png">
<title>Prime Moments HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: app shell. Desktop = grouped sidebar + content column; phone = bottom tab bar + floating "+" */
:root{
  --bg:#F6F1EB; --surface:#FFFFFF; --sand:#E8DFD6; --sand2:#F1EAE2; --line:#E4DACF;
  --fg:#0F0F0F; --muted:#7A6C5F; --accent:#6B4A35; --accent-ink:#FFFFFF; --brown:#5A3E2C;
  --ok:#2F6B4F; --ok-bg:#E2EFE6; --warn:#9C560C; --warn-bg:#F8E8D2; --bad:#A33A2E; --bad-bg:#F6E0DC; --info:#2D5B86; --info-bg:#E1EAF3; --done:#6E6A66; --done-bg:#ECE8E4;
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(60,40,25,.05),0 4px 14px rgba(60,40,25,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E0D; --surface:#1A1714; --sand:#2B2520; --sand2:#221E1A; --line:#342D27;
  --fg:#EFE8E0; --muted:#A99A8B; --accent:#D0A984; --accent-ink:#141110; --brown:#5A3E2C;
  --ok:#8FCBAA; --ok-bg:#1C2D24; --warn:#F0B36B; --warn-bg:#33261A; --bad:#EE9A8E; --bad-bg:#3A201C; --info:#9CC2E8; --info-bg:#1B2633; --done:#ADA69F; --done-bg:#26221F; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E0D; --surface:#1A1714; --sand:#2B2520; --sand2:#221E1A; --line:#342D27;
  --fg:#EFE8E0; --muted:#A99A8B; --accent:#D0A984; --accent-ink:#141110; --brown:#5A3E2C;
  --ok:#8FCBAA; --ok-bg:#1C2D24; --warn:#F0B36B; --warn-bg:#33261A; --bad:#EE9A8E; --bad-bg:#3A201C; --info:#9CC2E8; --info-bg:#1B2633; --done:#ADA69F; --done-bg:#26221F; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;max-width:1040px;width:100%;margin:0 auto;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- navigation ---- */
nav.side{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.side .brand,nav.side .grp,nav.side .newbtn,nav.side .d-only{display:none}
.nav-a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10.5px;padding:6px 6px;border-radius:10px;min-width:56px}
.nav-a svg{width:22px;height:22px;flex:none}
.nav-a[aria-current="page"]{color:var(--accent);font-weight:600}
.nav-a .cnt{display:none}
@media (min-width:960px){
  .app{grid-template-columns:244px 1fr}
  nav.side{position:sticky;top:0;inset:auto;height:100vh;align-self:start;overflow:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:1px;border-top:0;border-right:1px solid var(--line);padding:22px 14px 18px}
  nav.side .brand{display:block;margin:0 8px 18px}
  nav.side .grp{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 12px 4px}
  nav.side .newbtn{display:flex;margin:0 4px 6px}
  nav.side .d-only{display:flex}
  .nav-a{flex-direction:row;gap:12px;font-size:14px;padding:8px 12px;min-width:0}
  .nav-a svg{width:18px;height:18px}
  .nav-a[aria-current="page"]{background:var(--sand);color:var(--fg)}
  .nav-a .cnt{display:inline-block;margin-left:auto;font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:0 7px;font-weight:600}
  .nav-a .cnt:empty{display:none}
  .nav-a.m-only{display:none}
  main{padding-block:30px 60px}
  .fab{display:none}
}
.logo{background:var(--brown);color:#fff;border-radius:10px;padding:10px 12px;font-weight:600;letter-spacing:.12em;font-size:12px;display:inline-flex;align-items:center;gap:1px}
.logo i{display:inline-block;width:0;height:0;border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:3px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.2);cursor:pointer}
.fab.fab-s{bottom:calc(148px + env(safe-area-inset-bottom,0px));width:48px;height:48px;right:max(22px,env(safe-area-inset-right,0px));background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:0}.fab-s svg{display:block;margin:auto}

/* ---- page chrome ---- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:30px;line-height:1.15}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px;white-space:nowrap}
.tile .s{font-size:12px;color:var(--muted)}
.tile.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tile.dark .k,.tile.dark .s{color:color-mix(in srgb,var(--bg) 68%,var(--fg))}
.tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)} .tile.good .v{color:var(--ok)}
section.block{margin-bottom:28px}
section.block>h2{font-size:19px;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
section.block>h2 .meta{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr;gap:0 24px}
@media (min-width:860px){.cols{grid-template-columns:1.4fr 1fr}}
.cols>*{min-width:0}

/* ---- lists ---- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.row.two{grid-template-columns:minmax(0,1fr) auto}
.list>.row:first-child,.list>:first-child .row{border-top:0}
.row:hover{background:var(--sand2)}
.date{text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.date b{display:block;font-family:var(--display);font-size:20px}
.date span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.date.none b{font-size:16px;color:var(--muted)}
.main-t{min-width:0}
.main-t .t{font-weight:500;overflow-wrap:anywhere}
.main-t .d{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok,.p-Bevestigd,.p-Betaald,.p-Geboekt,.p-Actief,.p-Loopt,.p-Afgeleverd{background:var(--ok-bg);color:var(--ok)}
.p-warn,.p-Gereserveerd,.p-On-hold,.p-Voorschot,.p-Open,.p-In-afwachting,.p-Bijna-verlopen,.p-In-montage{background:var(--warn-bg);color:var(--warn)}
.p-done,.p-Afgerond,.p-Verlopen,.p-Gestopt{background:var(--done-bg);color:var(--done)}
.p-bad,.p-Geannuleerd,.p-Vervallen,.p-Verloren{background:var(--bad-bg);color:var(--bad)}
.p-info,.p-Nieuw,.p-Offerte-gestuurd,.p-Wacht-op-antwoord,.p-Te-checken{background:var(--info-bg);color:var(--info)}
.p-neutral{background:var(--sand);color:var(--fg)}
.row.cancel .t{text-decoration:line-through;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.toolbar .chips{margin:0}

/* ---- hero next shoot ---- */
.next{background:var(--brown);color:#F6EDE3;border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:22px;cursor:pointer;border:0;width:100%;text-align:left}
.next .big{font-family:var(--display);font-size:44px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;min-width:64px}
.next .big small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-top:4px;font-weight:500}
.next .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.next .ttl{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.25;margin:2px 0}
.next .sub{font-size:13px;opacity:.85}

/* ---- tasks ---- */
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.addline{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.addline input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}

/* ---- calendar ---- */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:8px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:62px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;background:none;border-top:0;border-left:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--sand2);color:var(--muted)}
.day.blk{background:var(--sand)}
.day.blk.out{background:color-mix(in srgb,var(--sand) 60%,var(--sand2))}
.day .blkbar{display:block;height:4px;border-radius:2px;background:var(--muted);opacity:.55}
@media (min-width:700px){.day .blkbar{display:none}}
.day .n{font-size:12px;font-variant-numeric:tabular-nums;font-weight:500;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.day .ev{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%}
.e-Bevestigd{background:var(--ok-bg);color:var(--ok)} .d-Bevestigd{background:var(--ok)}
.e-Gereserveerd{background:var(--warn-bg);color:var(--warn)} .d-Gereserveerd{background:var(--warn)}
.e-Afgerond{background:var(--done-bg);color:var(--done)} .d-Afgerond{background:var(--done)}
.e-Geannuleerd{background:var(--bad-bg);color:var(--bad);text-decoration:line-through} .d-Geannuleerd{background:var(--bad)}
.e-req{background:var(--info-bg);color:var(--info);border:1px dashed var(--info)} .d-req{background:var(--info)}
.newbox{background:var(--surface);border:2px solid var(--info);border-radius:var(--r);padding:4px 0;margin-bottom:22px;box-shadow:var(--shadow)}
.newbox h2{font-size:17px;padding:10px 14px 4px;display:flex;justify-content:space-between}
.prio{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bad);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:18px;cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
.prio b{font-weight:600}.prio span{font-size:13px;opacity:.9}
.p-prio{background:var(--bad);color:#fff}
.matrix td.hi{font-weight:700;color:var(--accent)}
.lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:22px}
.lead .tile .v{font-size:20px;white-space:normal}
.subtabs{display:flex;gap:6px;margin-bottom:18px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.kgrid .tile .v{font-size:24px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:24px;box-shadow:var(--shadow)}
.goal .gb{height:12px;background:var(--sand2);border-radius:6px;overflow:hidden;margin:10px 0 6px}.goal .gb span{display:block;height:100%;background:var(--accent);border-radius:6px}
.wk{display:flex;flex-wrap:wrap;gap:6px}.wk span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-variant-numeric:tabular-nums}
.minput{width:80px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);text-align:right}
.sbar{position:fixed;inset:0;z-index:50;background:rgba(15,12,10,.45);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.sbox{background:var(--surface);width:100%;max-width:620px;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;background:var(--surface);outline:none}
.sres{max-height:60vh;overflow:auto}.sres .row{grid-template-columns:110px minmax(0,1fr) auto}
.skind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hist{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.hist li{font-size:12.5px;color:var(--muted);margin-bottom:6px}.hist li b{color:var(--fg);font-weight:500}
.e-blk{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
@media (min-width:700px){.day{min-height:104px}.day .ev{display:block}.dots{display:none}}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav .btn{padding:7px 12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---- chart ---- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 10px;overflow-x:auto;box-shadow:var(--shadow)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(34px,1fr));gap:6px;align-items:end;height:190px;min-width:450px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;cursor:pointer;background:none;border:0;padding:0}
.bar .val{font-size:10.5px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px;white-space:nowrap}
.bar .seg{border-radius:4px 4px 0 0;display:block}
.bar .seg.c{background:var(--accent)}
.bar .seg.r{background:color-mix(in srgb,var(--warn) 50%,var(--surface))}
.bar .seg+.seg{border-radius:0}
.bar[aria-pressed="true"] .val{color:var(--fg);font-weight:600}
.bar[aria-pressed="true"] .seg.c{background:var(--fg)}
.mlabels{display:grid;grid-template-columns:repeat(12,minmax(34px,1fr));gap:6px;min-width:450px;font-size:11px;color:var(--muted);text-align:center;padding-top:6px}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;padding:7px 16px;font-size:13px}
.hbar .tr{height:10px;background:var(--sand2);border-radius:5px;overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar b{font-variant-numeric:tabular-nums;font-weight:500}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:14px 16px;font-variant-numeric:tabular-nums}
.kv .tot{font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.kv .neg{color:var(--bad)} .kv .pos{color:var(--ok)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:70ch}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px;min-width:520px}
.tbl th,.tbl td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{border-top:0;font-weight:500;color:var(--muted);font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.tot td{font-weight:600;background:var(--sand2)}

/* ---- kennisbank ---- */
.kb{display:grid;gap:10px}
.kb details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 16px;box-shadow:var(--shadow)}
.kb summary{cursor:pointer;padding:14px 0;font-family:var(--display);font-size:17px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.kb summary::-webkit-details-marker{display:none}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const now=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const pd=s=>{if(!s||!/^\d{4}-\d\d-\d\d/.test(s))return null;const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
const dl_=s=>{const d=pd(s);return d?`${d.getDate()} ${MAAND[d.getMonth()]} ${d.getFullYear()}`:"–"};
const dShort=s=>{const d=pd(s);return d?`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`:"–"};
const daysTo=s=>{const d=pd(s);return d?Math.round((d-now())/864e5):null};
const addDays=(s,n)=>{const d=pd(s)||now();d.setDate(d.getDate()+n);return iso(d)};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const cls=s=>"p-"+String(s||"").replace(/\s+/g,"-");
const pill=(s,c)=>s?`<span class="pill ${c||cls(s)}">${esc(s)}</span>`:"";
const vid=b=>b.status==="Geannuleerd"||b.status==="On hold"?0:(+b.video||0);
const sorted=(L,k="datum")=>[...L].sort((a,b)=>(a[k]||"9999").localeCompare(b[k]||"9999"));
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}

/* ================= business logic ================= */
const toReceive=b=>{if(b.status==="Geannuleerd"||b.status==="On hold"||b.status==="Gereserveerd"||b.betaling==="Betaald"||b.betaling==="Te checken")return 0;return Math.max(0,vid(b)-(+b.ontvangen||0))};
function sameDay(b){if(!b.datum||b.status==="Geannuleerd")return [];return S.bookings.filter(o=>o.id!==b.id&&o.datum===b.datum&&o.status!=="Geannuleerd")}
const tmin=t=>{if(!t||!/^\d\d:\d\d/.test(t))return null;return +t.slice(0,2)*60+ +t.slice(3,5)};
/* ================= vertrekuur (reistijd vanaf thuis) ================= */
const cleanAddr=s=>{s=(s||"").split(/\s+\/\s+|\s+→\s+|\s+->\s+/)[0].replace(/\([^)]*\)/g,"").replace(/^[A-Za-zÀ-ÿçğışöüÇĞİŞÖÜ ]{2,20}:\s*/,"").trim();return /nog navragen|nog te bespreken|^$/i.test(s)?"":s};
const hhmm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const durTxt=m=>m>=60?Math.floor(m/60)+"u"+String(m%60).padStart(2,"0"):m+" min";
function vertrek(b){const st=tmin(b.start);const mins=b.reisMinHand!=null&&b.reisMinHand!==""?+b.reisMinHand:(b.reisAdres===cleanAddr(b.locatie)?b.reisMin:null);
  if(st===null||mins==null)return null;const drive=b.reisMinHand!=null&&b.reisMinHand!==""?mins:Math.round(mins*1.15);let t=st-30-drive;t=Math.floor(t/5)*5;
  return{tijd:hhmm(t),drive,km:b.reisKm,aan:hhmm(st-30),hand:b.reisMinHand!=null&&b.reisMinHand!==""}}
const vertrekTxt=b=>{const v=vertrek(b);return v?`Vertrek ±${v.tijd} · ${durTxt(v.drive)} rijden${v.km&&!v.hand?" ("+Math.round(v.km)+" km)":""} · om ${v.aan} ter plaatse`:""};
let routeBusy=false;const routeTried=new Set();
async function fillRoutes(){if(routeBusy||!canWrite||!SB.functions)return;routeBusy=true;
  try{const todo=S.bookings.filter(b=>b.status!=="Geannuleerd"&&b.datum&&daysTo(b.datum)>=0&&daysTo(b.datum)<=400&&cleanAddr(b.locatie)&&b.reisAdres!==cleanAddr(b.locatie)&&!routeTried.has(b.id+"|"+cleanAddr(b.locatie)));
    for(const b of todo.slice(0,40)){const a=cleanAddr(b.locatie);routeTried.add(b.id+"|"+a);
      try{const {data,error}=await SB.functions.invoke("route",{body:{address:a}});if(error)continue;
        await db.doc("bookings/"+b.id).update(data&&data.found?{reisAdres:a,reisMin:data.minutes,reisKm:data.km}:{reisAdres:a,reisMin:null,reisKm:null})}catch(e){}
      await new Promise(r=>setTimeout(r,1200))}}finally{routeBusy=false}}
function overlap(b){const s1=tmin(b.start);if(s1===null)return false;let e1=tmin(b.eind);if(e1===null)e1=s1+60;if(e1<=s1)e1+=1440;
  return sameDay(b).some(o=>{const s2=tmin(o.start);if(s2===null)return false;let e2=tmin(o.eind);if(e2===null)e2=s2+60;if(e2<=s2)e2+=1440;return s1<e2&&s2<e1})}
function flags(b){const f=[];if(b.status==="Geannuleerd"||b.status==="On hold")return f;const dt=daysTo(b.datum);
  if(!b.datum)f.push("Datum ontbreekt");
  if(dt!==null&&dt<0&&b.status==="Gereserveerd")f.push("Doorgegaan?");
  if(!b.video&&!b.gratis&&b.status!=="Geannuleerd")f.push("Prijs ontbreekt");
  if(dt!==null&&dt>=0&&overlap(b))f.push("Overlapt met andere shoot");
  if(dt!==null&&dt>=0&&inBlock(b.datum))f.push("Valt in "+inBlock(b.datum).titel);
  return f}
function inBlock(ds){return S.blocks.find(k=>k.van&&ds>=k.van&&ds<=(k.tot||k.van))}
const invTotal=i=>Math.max(0,(i.regels||[]).reduce((a,r)=>a+(+r.bedrag||0),0)-(+i.korting||0));
function invStatus(i){if(i.status==="Betaald")return "Betaald";if(i.vervaldatum&&daysTo(i.vervaldatum)<0)return "Vervallen";return "Open"}
function deductible(p,year){const z=(p.zakelijk??100)/100;const amt=(+p.bedrag||0)*z;const y0=+(p.datum||"").slice(0,4);if(!y0)return 0;
  if(p.soort==="Investering"){const n=+p.jaren||3;return year>=y0&&year<y0+n?amt/n:0}return year===y0?amt:0}
function restwaarde(p,year){if(p.soort!=="Investering")return 0;const z=(p.zakelijk??100)/100;const amt=(+p.bedrag||0)*z;const y0=+(p.datum||"").slice(0,4);const n=+p.jaren||3;const done=Math.max(0,Math.min(n,year-y0+1));return amt-amt/n*done}
function warranty(it){if(!it.garantieTot)return "";const d=daysTo(it.garantieTot);if(d<0)return "Verlopen";if(d<90)return "Bijna verlopen";return "Loopt"}
function nextInvNr(year){const nums=S.invoices.filter(i=>(i.nummer||"").startsWith(year+"-")).map(i=>+i.nummer.split("-")[1]||0);return `${year}-${String((nums.length?Math.max(...nums):0)+1).padStart(3,"0")}`}

   <div class="amt">${b.video?eur(b.video):(b.gratis?"<small>gratis</small>":"–")}${b.foto?`<small>+ foto ${eur(b.foto)}</small>`:""}</div></button>`;}

V.boekingen=()=>{

const LSTAT=["Nieuw","Offerte gestuurd","Wacht op antwoord","Geboekt","Verloren"];

const invOfBooking=b=>S.invoices.filter(i=>i.status==="Betaald"&&(i._booking===b.id||(b.factuur&&i.nummer&&String(b.factuur).includes(i.nummer))));
const recvOf=b=>b.betaling==="Betaald"?vid(b):(+b.ontvangen||0);
function bankOf(b){const r=recvOf(b);if(b.betaalVia==="Bank")return r;let x=invOfBooking(b).reduce((a,i)=>a+invTotal(i),0);if(b.betaalVia==="Cash + bank")x=Math.max(x,+b.ontvangenBank||0);if(b.betaalVia==="Cash")x=0;return Math.min(r,x)}
function kasCalc(){const B=S.bookings.filter(b=>b.status!=="Geannuleerd"&&b.status!=="On hold"&&recvOf(b)>0);
  const rows=B.map(b=>({b,r:recvOf(b),bank:bankOf(b)})).map(x=>Object.assign(x,{cash:x.r-x.bank}));
  const linked=new Set();S.bookings.forEach(b=>invOfBooking(b).forEach(i=>linked.add(i.id)));
  const loose=S.invoices.filter(i=>i.status==="Betaald"&&!linked.has(i.id));
  const bank=rows.reduce((a,x)=>a+x.bank,0)+loose.reduce((a,i)=>a+invTotal(i),0);const cashIn=rows.reduce((a,x)=>a+x.cash,0);
  const K=sorted(S.kas||[],"datum");const tel=K.filter(k=>k.soort==="Telling").slice(-1)[0];
  const uit=K.filter(k=>k.soort==="Uit").reduce((a,k)=>a+(+k.bedrag||0),0),inX=K.filter(k=>k.soort==="In").reduce((a,k)=>a+(+k.bedrag||0),0);
  const verwacht=cashIn+inX-uit;return{rows,loose,bank,cashIn,uit,inX,verwacht,tel,K,totaal:bank+cashIn}}

   <div class="${diff==null?"":Math.abs(diff)<1?"ok":diff<0?"bad":"ok"}"><span>${diff==null?"Verschil":diff<0?"Ontbreekt":diff>0?"Meer dan verwacht":"Klopt"}</span><b>${diff==null?"tel je doos":eur(Math.abs(diff))}</b></div>
  </div>
  ${diff!=null&&diff<-1?`<p class="note">Ontbreekt er iets? Meestal is dat cash die je aan je team (Bahri, Tuğba, tweede shooter) of voor iets anders hebt gegeven. Voeg dat toe met <b>− Cash uit</b>, dan klopt je doos weer.</p>`:""}
  <div class="cols"><div>
   <section class="block"><h2>Cash bewegingen <span class="meta">${k.K.length}</span></h2>${k.K.length?`<div class="list">${k.K.slice().reverse().map(x=>`<button class="row two" data-edit="kas:${x.id}"><div class="main-t"><div class="t">${esc(x.omschrijving||x.soort)}</div><div class="d">${dl_(x.datum)} · ${esc(x.soort)}${x.wie?" · "+esc(x.wie):""}</div></div><div class="amt" style="color:${x.soort==="Uit"?"var(--bad)":x.soort==="In"?"var(--ok)":"var(--fg)"}">${x.soort==="Uit"?"− ":x.soort==="In"?"+ ":"= "}${eur(+x.bedrag||0)}</div></button>`).join("")}</div>`:`<div class="empty">Nog niets genoteerd.</div>`}</section>
  </div><div>
   <section class="block"><h2>Per shoot <span class="meta">cash / bank</span></h2><div class="tbl-wrap"><table class="tbl" style="min-width:380px"><thead><tr><th>Klant</th><th>Ontvangen</th><th>Bank</th><th>Cash</th></tr></thead><tbody>
    ${k.rows.sort((a,b)=>(a.b.datum||"").localeCompare(b.b.datum||"")).map(x=>`<tr data-edit="bookings:${x.b.id}" style="cursor:pointer"><td style="text-align:left">${esc(x.b.klant)} <small style="color:var(--muted)">${dShort(x.b.datum)}</small></td><td>${eur(x.r)}</td><td>${x.bank?eur(x.bank):"–"}</td><td>${x.cash?eur(x.cash):"–"}</td></tr>`).join("")}
    ${k.loose.map(i=>`<tr><td style="text-align:left">${esc(i.klant)} <small style="color:var(--muted)">factuur ${esc(i.nummer)}</small></td><td>${eur(invTotal(i))}</td><td>${eur(invTotal(i))}</td><td>–</td></tr>`).join("")}
   </tbody></table></div><p class="note">Een shoot staat op <b>bank</b> als er een betaalde factuur aan hangt of als je bij de boeking "Betaald via: Bank" kiest. De rest telt als cash. Pas het aan bij Bewerk › Prijs & betaling.</p></section>

function clientIndex(){const map={};const key=s=>(s||"").trim();
  S.bookings.forEach(b=>{const k=key(b.klant);if(!k)return;const o=map[k]=map[k]||{naam:k,bookings:[],invoices:[],contact:""};o.bookings.push(b);if(b.contact&&!o.contact)o.contact=b.contact});
  S.invoices.forEach(i=>{const k=Object.keys(map).find(n=>(i.klant||"").toLowerCase().includes(n.toLowerCase())||n.toLowerCase().includes((i.klant||"").toLowerCase().split(" (")[0]));const o=k?map[k]:(map[i.klant]=map[i.klant]||{naam:i.klant,bookings:[],invoices:[],contact:""});o.invoices.push(i)});
  return map}

V.aankopen=()=>{
  const yr=+(UI.aYear||now().getFullYear());const years=[...new Set(S.purchases.map(p=>(p.datum||"").slice(0,4)).filter(Boolean).concat([String(now().getFullYear())]))].sort();
  const L=S.purchases.filter(p=>(p.datum||"").startsWith(String(yr))).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  const spent=L.reduce((a,p)=>a+(+p.bedrag||0),0);
  const ded=S.purchases.reduce((a,p)=>a+deductible(p,yr),0);
  const inv=L.filter(p=>p.soort==="Investering").reduce((a,p)=>a+(+p.bedrag||0),0);
  const byCat={};L.forEach(p=>byCat[p.categorie||"Overige"]=(byCat[p.categorie||"Overige"]||0)+(+p.bedrag||0));
  const mx=Math.max(1,...Object.values(byCat));
  const groups=[];L.forEach(p=>{const k=p.datum.slice(0,7);let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,items:[]});g.items.push(p)});
  return `<div class="ph"><div><div class="eyebrow">Kosten & investeringen</div><h1>Aankopen</h1></div><div class="acts"><button class="btn ghost" data-csv="purchases">Exporteer voor boekhouder</button><button class="btn" data-new="purchases">+ Aankoop</button></div></div>

  <div class="tiles"><div class="tile dark"><div class="k">Uitgegeven ${yr}</div><div class="v">${eur2(spent)}</div><div class="s">${L.length} regels</div></div><div class="tile"><div class="k">Aftrekbaar ${yr}</div><div class="v">${eur2(ded)}</div><div class="s">kosten + afschrijving</div></div><div class="tile"><div class="k">Waarvan investeringen</div><div class="v">${eur2(inv)}</div><div class="s">afgeschreven over 3 jaar</div></div></div>
  <div class="cols"><div>${groups.map(g=>`<section class="block"><h2>${cap(MAANDL[+g.k.slice(5,7)-1])} <span class="meta">${eur2(g.items.reduce((a,p)=>a+(+p.bedrag||0),0))}</span></h2><div class="list">${g.items.map(p=>rowP(p,yr)).join("")}</div></section>`).join("")||`<div class="empty">Geen aankopen in ${yr}.</div>`}</div>
  <div><section class="block"><h2>Per categorie</h2><div class="list" style="padding:8px 0">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><span class="tr"><span style="width:${v/mx*100}%"></span></span><b>${eur(v)}</b></div>`).join("")||`<div class="hbar"><span style="color:var(--muted)">Nog niets</span></div>`}</div></section>
  <p class="note">Een aankoop die jaren meegaat (camera, lens, licentie) is een investering: per jaar trek je maar een deel af. De rest is gewone kost. Laat de keuze nakijken door je boekhouder.</p></div></div>`};

function expertForecast(scKey){const sc=SCEN[scKey]||SCEN.realistisch;const td=iso(now());const B=S.bookings.filter(b=>b.status!=="Geannuleerd"&&b.status!=="On hold"&&b.datum);
  const ymOf=d=>d.slice(0,7);const sumM=(k,pred)=>B.filter(b=>ymOf(b.datum)===k&&(!pred||pred(b))).reduce((a,b)=>a+vid(b),0);
  const rec=S.recurring.filter(r=>r.status==="Actief").reduce((a,r)=>a+(+r.bedrag||0),0);
  const mk=(y,m)=>`${y}-${String(m+1).padStart(2,"0")}`;const n0=now();

  const pts=[];for(let i=-3;i<=1;i++){const d=new Date(n0.getFullYear(),n0.getMonth()+i,1);const k=mk(d.getFullYear(),d.getMonth());const v=sumM(k);if(v>0)pts.push(v/SEASON[d.getMonth()])}
  pts.sort((a,b)=>a-b);const base=pts.length?pts[Math.floor((pts.length-1)/2)]:0;
  const paid=B.filter(b=>vid(b)>0);const avg=paid.length?paid.reduce((a,b)=>a+vid(b),0)/paid.length:0;
  const maxShoots=+(S.settings.maxShoots||8);const cap=maxShoots*avg;

    const booked=B.filter(b=>ymOf(b.datum)===k&&b.datum>=td).reduce((a,b)=>a+vid(b)*(b.status==="Gereserveerd"?0.5:1),0);
    const cur=i===0&&!so;const done=cur?B.filter(b=>ymOf(b.datum)===k&&b.datum<td).reduce((a,b)=>a+vid(b),0):0;const left=cur?Math.max(0,1-n0.getDate()/30):1;

  const tay=e.target.closest("[data-tay]");if(tay){UI.taYear=tay.dataset.tay;return render()}
  if(e.target.closest("[data-endpreview]")){UI.preview=null;CREW.un.forEach(f=>{try{f()}catch(_){}});CREW.un=[];location.hash="team";return render()}
  if(e.target.closest("[data-crewlogout]")){lsSet(null);UI.crewErr="";watchCrew(null);return}

  if(t.dataset.act==="lost"){UI.lostOpen=!UI.lostOpen;return render()}
  if(t.dataset.edit){const [c,id]=t.dataset.edit.split(":");return openForm(c,id)}
  if(t.dataset.new)return newOf(t.dataset.new);
  if(t.dataset.newb!==undefined)return newOf("bookings",t.dataset.newb?{datum:t.dataset.newb}:{});
  if(t.dataset.inv)return openInvoice(t.dataset.inv);
  if(t.dataset.bf){UI.bFilter=t.dataset.bf;return render()}
  if(t.dataset.ff){UI.fFilter=t.dataset.ff;return render()}
  if(t.dataset.fy){UI.fYear=t.dataset.fy;return render()}
  if(t.dataset.ay){UI.aYear=t.dataset.ay;return render()}
  if(t.dataset.yr){UI.year=t.dataset.yr;UI.month=null;return render()}
  if(t.dataset.mo){const i=+t.dataset.mo;UI.month=UI.month===i?null:i;return render()}
  if(t.dataset.cal!==undefined){const d=+t.dataset.cal;if(!d){const n=now();UI.cal=[n.getFullYear(),n.getMonth()];UI.calSel=iso(n)}else{let [y,m]=UI.cal;m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}UI.cal=[y,m];UI.calSel=null}return render()}
  if(t.dataset.day){const ds=t.dataset.day;const d=pd(ds);if(d.getMonth()!==UI.cal[1])UI.cal=[d.getFullYear(),d.getMonth()];UI.calSel=UI.calSel===ds?null:ds;return render()}
  if(t.hasAttribute("data-clearsel")){e.preventDefault();UI.calSel=null;return render()}
  if(t.dataset.klant)return openClient(t.dataset.klant);
  if(t.dataset.tdel)return remove("tasks",t.dataset.tdel);
  if(t.dataset.csv)return csv(t.dataset.csv);
  if(t.dataset.copy){const el=document.getElementById(t.dataset.copy);try{await navigator.clipboard.writeText(el.textContent);toast("Gekopieerd")}catch(_){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Geselecteerd, kopieer met je toetsenbord")}}

const SB=window.supabase.createClient("https://unktazjceutqoduzjnfq.supabase.co","sb_publishable_6UsFWGZPbhvMqzRZfAbzaQ_Gg-8zs8z",{auth:{persistSession:true,autoRefreshToken:true}});
function makeDb(sb){
  const cache={},listeners={},docL={},timers={};
  const snapOf=c=>({docs:(cache[c]||[]).map(r=>({id:r.id,exists:true,data:()=>r.data}))});
  const emit=c=>{(listeners[c]||[]).forEach(f=>f(snapOf(c)));(docL[c]||[]).forEach(([id,f])=>{const r=(cache[c]||[]).find(x=>x.id===id);f({id,exists:!!r,data:()=>r&&r.data})})};
  async function load(c){const {data,error}=await sb.from("docs").select("id,data").eq("collection",c);if(error)throw error;cache[c]=data||[];emit(c)}
  const later=c=>{clearTimeout(timers[c]);timers[c]=setTimeout(()=>load(c).catch(()=>{}),250)};
  sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const c=(p.new&&p.new.collection)||(p.old&&p.old.collection);if(c&&(listeners[c]||docL[c]))later(c)}).subscribe();
  const split=p=>{const k=p.lastIndexOf("/");return [p.slice(0,k),p.slice(k+1)]};
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const chk=({error})=>{if(error){const e=new Error(error.message);e.code=error.code==="42501"?"invalid_argument":"unavailable";throw e}};
  function doc(path){const [c,id]=split(path);return{id,
    get:async()=>{const {data,error}=await sb.from("docs").select("data").eq("collection",c).eq("id",id).maybeSingle();if(error)throw error;return{id,exists:!!data,data:()=>data&&data.data}},
    set:async o=>{chk(await sb.from("docs").upsert({collection:c,id,data:o}));await load(c)},
    update:async o=>{const cur=((cache[c]||[]).find(x=>x.id===id)||{}).data||(await this_get(c,id))||{};chk(await sb.from("docs").upsert({collection:c,id,data:Object.assign({},cur,o)}));await load(c)},
    delete:async()=>{chk(await sb.from("docs").delete().eq("collection",c).eq("id",id));await load(c)},
    onSnapshot:(n,e)=>{(docL[c]=docL[c]||[]).push([id,n]);load(c).catch(err=>e&&e(err));return()=>{}}}}
  async function this_get(c,id){const {data}=await sb.from("docs").select("data").eq("collection",c).eq("id",id).maybeSingle();return data&&data.data}
  function collection(c){return{
    onSnapshot:(n,e)=>{(listeners[c]=listeners[c]||[]).push(n);load(c).catch(err=>e&&e(err));return()=>{}},
    get:async()=>{await load(c);return snapOf(c)},
    add:async o=>{const id=rid();chk(await sb.from("docs").insert({collection:c,id,data:o}));await load(c);return doc(c+"/"+id)},
    doc:id=>doc(c+"/"+id)}}
  return{collection,doc}}
dl={save:async({filename,data})=>{const b=new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"text/html;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return{status:"saved"}}};
function loginPage(msg){$("#nav").hidden=true;$("#fab").hidden=true;document.querySelector(".app").style.gridTemplateColumns="1fr";
  $("#main").innerHTML=`<div class="crew-wrap" style="max-width:420px;padding-top:6vh"><div class="crew-top"><span class="logo">PRIMEMOMENTS<i></i></span><span class="eyebrow" style="margin:0">Headquarter</span></div>
   <form class="entry" id="loginform"><h2 style="font-size:24px;margin-bottom:6px">Aanmelden</h2><p class="note" style="margin-top:0">Alleen voor Hatice.</p>
   <div class="f" style="margin-top:14px"><label for="l-mail">E-mail</label><input id="l-mail" type="email" autocomplete="username" required></div>
   <div class="f" style="margin-top:10px"><label for="l-pw">Wachtwoord</label><input id="l-pw" type="password" autocomplete="current-password" required minlength="8"></div>
   <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" name="mode" value="in">Aanmelden</button><button class="btn ghost" type="button" id="l-forgot">Wachtwoord vergeten?</button></div>
   ${msg?`<p class="note" style="color:var(--warn)">${esc(msg)}</p>`:""}</form></div>`;
  $("#l-forgot").addEventListener("click",async()=>{const email=$("#l-mail").value.trim();if(!email){$("#l-mail").focus();return loginPage("Vul eerst je e-mailadres in en tik dan opnieuw op 'Wachtwoord vergeten?'.")}
    const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    loginPage(error?(/rate/i.test(error.message)?"Even wachten: er is net al een mail verstuurd. Probeer over een paar minuten opnieuw.":error.message):"Check je mailbox ("+email+"). Klik op de link in de mail van Supabase en kies daar een nieuw wachtwoord.")});
  const f=$("#loginform");f.addEventListener("submit",async e=>{e.preventDefault();const mode=e.submitter&&e.submitter.value;const email=$("#l-mail").value.trim(),password=$("#l-pw").value;
    if(mode==="up"){const {error}=await SB.auth.signUp({email,password});return loginPage(error?error.message:"Account aangemaakt. Bevestig je e-mailadres via de mail van Supabase en meld je daarna hier aan. Laat Claude dan weten dat je account klaar is.")}
    const {error}=await SB.auth.signInWithPassword({email,password});if(error)return loginPage(error.message==="Invalid login credentials"?"E-mail of wachtwoord klopt niet.":error.message);start()})}
async function importFile(file){try{const j=JSON.parse(await file.text());const rows=(j.docs||[]).filter(r=>r.collection&&r.id&&r.data);toast("Importeren… "+rows.length+" items");
  for(let k=0;k<rows.length;k+=100){const {error}=await SB.from("docs").upsert(rows.slice(k,k+100));if(error)throw error}
  toast("Klaar: "+rows.length+" items geïmporteerd");COLS.forEach(c=>db.collection(c).get().catch(()=>{}))}catch(err){toast("Importeren mislukt: "+(err.message||err))}}
document.addEventListener("change",e=>{if(e.target.id==="importfile"&&e.target.files[0])importFile(e.target.files[0])});
/* ---- back-ups ---- */
const bkName=t=>new Date(t).toLocaleString("nl-BE",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
function bkDownload(rows,t){const n=new Date(t||Date.now()).toISOString().slice(0,10);dl.save({filename:`PrimeMoments_backup_${n}.json`,data:JSON.stringify({gemaakt:new Date(t||Date.now()).toISOString(),docs:rows},null,1)});try{localStorage.setItem("pm-bk-dl",String(Date.now()))}catch(e){}}
async function openBackups(){
  const {sc,close}=openSheet(`<h3>Back-ups</h3><p class="sub">Elke nacht bewaart je HQ automatisch een volledige kopie. Die blijft 60 dagen staan.</p>
   <div class="actions" style="position:static;margin:0 0 14px;padding:0"><div><button class="btn" data-bknow>Nu een back-up maken</button><button class="btn ghost" data-bkdl>Download kopie naar je toestel</button></div></div>
   <div data-bklist class="list"><div class="empty">Laden…</div></div>
   <p class="note">Terugzetten zet al je boekingen, klanten, facturen… terug zoals ze op dat moment waren. Je huidige toestand wordt eerst zelf ook bewaard, dus je kan altijd terug. Tip: download één keer per maand een kopie en zet die bij je Klantenbestand.</p>
   <div class="actions"><div></div><div><button class="btn ghost" data-close>Sluit</button></div></div>`,true);
  const box=sc.querySelector("[data-bklist]");let armed=null;
  const load=async()=>{const {data,error}=await SB.rpc("list_backups");if(error){box.innerHTML=`<div class="empty">Back-ups laden lukt niet.</div>`;return}
    box.innerHTML=(data||[]).map(r=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="t">${esc(bkName(r.snapshot_at))}</div><div class="s">${r.n} items</div></div><div class="amt" style="display:flex;gap:6px"><button class="btn ghost" data-bkget="${esc(r.snapshot_at)}">Download</button><button class="btn ghost" data-bkrestore="${esc(r.snapshot_at)}">Terugzetten</button></div></div>`).join("")||`<div class="empty">Nog geen back-ups.</div>`};
  load();
  sc.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;
    if(t.hasAttribute("data-bknow")){t.disabled=true;const {error}=await SB.rpc("make_backup");t.disabled=false;toast(error?"Back-up mislukt":"Back-up gemaakt");load()}
    if(t.hasAttribute("data-bkdl")){const rows=[];COLS.forEach(c=>(S[c]||[]).forEach(x=>{const {id,...data}=x;rows.push({collection:c,id,data})}));bkDownload(rows);toast("Gedownload")}
    if(t.dataset.bkget){const {data,error}=await SB.from("docs_backup").select("collection,id,data").eq("snapshot_at",t.dataset.bkget);if(error){toast("Download mislukt");return}bkDownload(data,t.dataset.bkget)}
    if(t.dataset.bkrestore){if(armed!==t.dataset.bkrestore){armed=t.dataset.bkrestore;t.textContent="Zeker? Tik opnieuw";return}
      t.disabled=true;t.textContent="Bezig…";const {data,error}=await SB.rpc("restore_backup",{p_at:t.dataset.bkrestore});
      if(error){toast("Terugzetten mislukt");t.disabled=false;t.textContent="Terugzetten";return}toast(data+" items teruggezet");close();setTimeout(()=>location.reload(),900)}});
}
document.addEventListener("click",e=>{if(e.target.closest("[data-backups]"))openBackups()});
document.addEventListener("click",async e=>{if(e.target.closest("[data-logout]")){await SB.auth.signOut();location.hash="";location.reload()}});
let started=false;
/* voorbije shoots vanzelf afronden: dag erna -> Afgerond + In montage, na 3 weken -> Afgeleverd */
function autoClose(){(S.bookings||[]).forEach(b=>{const dt=daysTo(b.datum);if(dt===null||dt>=0)return;const u={};
  if(b.status==="Bevestigd")u.status="Afgerond";
  const st=u.status||b.status;
  if(st==="Afgerond"){if(b.levering==="Nog te filmen"||!b.levering)u.levering=dt<-21?"Afgeleverd":"In montage";else if(b.levering==="In montage"&&dt<-21)u.levering="Afgeleverd"}
  if(Object.keys(u).length)db.doc("bookings/"+b.id).update(u).catch(()=>{})})}
function newPwPage(msg){$("#nav").hidden=true;$("#fab").hidden=true;document.querySelector(".app").style.gridTemplateColumns="1fr";
  $("#main").innerHTML=`<div class="crew-wrap" style="max-width:420px;padding-top:6vh"><div class="crew-top"><span class="logo">PRIMEMOMENTS<i></i></span><span class="eyebrow" style="margin:0">Headquarter</span></div>
   <form class="entry" id="pwform"><h2 style="font-size:24px;margin-bottom:6px">Nieuw wachtwoord</h2><p class="note" style="margin-top:0">Kies een nieuw wachtwoord van minstens 8 tekens.</p>
   <div class="f" style="margin-top:14px"><label for="n-pw">Nieuw wachtwoord</label><input id="n-pw" type="password" autocomplete="new-password" required minlength="8"></div>
   <div class="f" style="margin-top:10px"><label for="n-pw2">Nog eens</label><input id="n-pw2" type="password" autocomplete="new-password" required minlength="8"></div>
   <div style="margin-top:16px"><button class="btn">Bewaar en ga naar je HQ</button></div>${msg?`<p class="note" style="color:var(--warn)">${esc(msg)}</p>`:""}</form></div>`;
  $("#pwform").addEventListener("submit",async e=>{e.preventDefault();const a=$("#n-pw").value,b=$("#n-pw2").value;if(a!==b)return newPwPage("De twee wachtwoorden zijn niet gelijk.");
    const {error}=await SB.auth.updateUser({password:a});if(error)return newPwPage(error.message);history.replaceState(null,"",location.pathname);toast("Nieuw wachtwoord bewaard");start()})}
let recovering=/type=recovery/.test(location.hash);
if(SB.auth.onAuthStateChange)SB.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){recovering=true;newPwPage()}});
async function start(){const hq=location.hash+location.search;if(/error_code=|error=access_denied/.test(hq)){history.replaceState(null,"",location.pathname);return loginPage("Deze resetlink is verlopen of al gebruikt. Tik op 'Wachtwoord vergeten?' voor een nieuwe mail en klik op de nieuwste link.")}
  const {data:{session}}=await SB.auth.getSession();if(recovering)return session?newPwPage():loginPage("De link is verlopen. Vraag een nieuwe mail aan.");if(!session)return loginPage();
  const {data:adm}=await SB.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!adm)return loginPage("Je bent aangemeld als "+session.user.email+", maar dit account heeft nog geen toegang. Laat Claude weten dat je account klaar is.");
  if(started)return;started=true;db=makeDb(SB);canWrite=true;UI.mode="owner";render();
  const pending=new Set(COLS);
  const done=c=>{pending.delete(c);if(c==="bookings"){autoClose();setTimeout(fillRoutes,1500)}if(!pending.size&&!ready)ready=true;rerender()};
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>Object.assign({id:x.id},x.data()));done(c)},()=>done(c)));
  db.doc("settings/finance").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},S.settings,s.data());rerender()},()=>{});
  db.doc("settings/feed").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},S.settings,{feedToken:s.data().token});rerender()},()=>{});
  db.doc("settings/team").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},S.settings,{teamCode:s.data().teamCode});rerender()},()=>{});
  setTimeout(()=>{if(!ready){ready=true;render()}},8000)}
start();
})();
