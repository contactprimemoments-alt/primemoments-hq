<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5A3E2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PM HQ">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/hq-192.png">
<link rel="apple-touch-icon" href="icons/hq-180.png">
<title>Prime Moments HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: app shell. Desktop = grouped sidebar + content column; phone = bottom tab bar + floating "+" */
:root{
  --bg:#F6F1EB; --surface:#FFFFFF; --sand:#E8DFD6; --sand2:#F1EAE2; --line:#E4DACF;
  --fg:#0F0F0F; --muted:#7A6C5F; --accent:#6B4A35; --accent-ink:#FFFFFF; --brown:#5A3E2C;
  --ok:#2F6B4F; --ok-bg:#E2EFE6; --warn:#9C560C; --warn-bg:#F8E8D2; --bad:#A33A2E; --bad-bg:#F6E0DC; --info:#2D5B86; --info-bg:#E1EAF3; --done:#6E6A66; --done-bg:#ECE8E4;
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(60,40,25,.05),0 4px 14px rgba(60,40,25,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E0D; --surface:#1A1714; --sand:#2B2520; --sand2:#221E1A; --line:#342D27;
  --fg:#EFE8E0; --muted:#A99A8B; --accent:#D0A984; --accent-ink:#141110; --brown:#5A3E2C;
  --ok:#8FCBAA; --ok-bg:#1C2D24; --warn:#F0B36B; --warn-bg:#33261A; --bad:#EE9A8E; --bad-bg:#3A201C; --info:#9CC2E8; --info-bg:#1B2633; --done:#ADA69F; --done-bg:#26221F; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E0D; --surface:#1A1714; --sand:#2B2520; --sand2:#221E1A; --line:#342D27;
  --fg:#EFE8E0; --muted:#A99A8B; --accent:#D0A984; --accent-ink:#141110; --brown:#5A3E2C;
  --ok:#8FCBAA; --ok-bg:#1C2D24; --warn:#F0B36B; --warn-bg:#33261A; --bad:#EE9A8E; --bad-bg:#3A201C; --info:#9CC2E8; --info-bg:#1B2633; --done:#ADA69F; --done-bg:#26221F; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;max-width:1040px;width:100%;margin:0 auto;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- navigation ---- */
nav.side{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.side .brand,nav.side .grp,nav.side .newbtn,nav.side .d-only{display:none}
.nav-a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10.5px;padding:6px 6px;border-radius:10px;min-width:56px}
.nav-a svg{width:22px;height:22px;flex:none}
.nav-a[aria-current="page"]{color:var(--accent);font-weight:600}
.nav-a .cnt{display:none}
@media (min-width:960px){
  .app{grid-template-columns:244px 1fr}
  nav.side{position:sticky;top:0;inset:auto;height:100vh;align-self:start;overflow:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:1px;border-top:0;border-right:1px solid var(--line);padding:22px 14px 18px}
  nav.side .brand{display:block;margin:0 8px 18px}
  nav.side .grp{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 12px 4px}
  nav.side .newbtn{display:flex;margin:0 4px 6px}
  nav.side .d-only{display:flex}
  .nav-a{flex-direction:row;gap:12px;font-size:14px;padding:8px 12px;min-width:0}
  .nav-a svg{width:18px;height:18px}
  .nav-a[aria-current="page"]{background:var(--sand);color:var(--fg)}
  .nav-a .cnt{display:inline-block;margin-left:auto;font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:0 7px;font-weight:600}
  .nav-a .cnt:empty{display:none}
  .nav-a.m-only{display:none}
  main{padding-block:30px 60px}
  .fab{display:none}
}
.logo{background:var(--brown);color:#fff;border-radius:10px;padding:10px 12px;font-weight:600;letter-spacing:.12em;font-size:12px;display:inline-flex;align-items:center;gap:1px}
.logo i{display:inline-block;width:0;height:0;border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:3px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.2);cursor:pointer}

/* ---- page chrome ---- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:30px;line-height:1.15}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px;white-space:nowrap}
.tile .s{font-size:12px;color:var(--muted)}
.tile.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tile.dark .k,.tile.dark .s{color:color-mix(in srgb,var(--bg) 68%,var(--fg))}
.tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)} .tile.good .v{color:var(--ok)}
section.block{margin-bottom:28px}
section.block>h2{font-size:19px;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
section.block>h2 .meta{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr;gap:0 24px}
@media (min-width:860px){.cols{grid-template-columns:1.4fr 1fr}}
.cols>*{min-width:0}

/* ---- lists ---- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.row.two{grid-template-columns:minmax(0,1fr) auto}
.list>.row:first-child,.list>:first-child .row{border-top:0}
.row:hover{background:var(--sand2)}
.date{text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.date b{display:block;font-family:var(--display);font-size:20px}
.date span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.date.none b{font-size:16px;color:var(--muted)}
.main-t{min-width:0}
.main-t .t{font-weight:500;overflow-wrap:anywhere}
.main-t .d{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok,.p-Bevestigd,.p-Betaald,.p-Geboekt,.p-Actief,.p-Loopt,.p-Afgeleverd{background:var(--ok-bg);color:var(--ok)}
.p-warn,.p-Gereserveerd,.p-Voorschot,.p-Open,.p-In-afwachting,.p-Bijna-verlopen,.p-In-montage{background:var(--warn-bg);color:var(--warn)}
.p-done,.p-Afgerond,.p-Verlopen,.p-Gestopt{background:var(--done-bg);color:var(--done)}
.p-bad,.p-Geannuleerd,.p-Vervallen,.p-Verloren{background:var(--bad-bg);color:var(--bad)}
.p-info,.p-Nieuw,.p-Offerte-gestuurd,.p-Wacht-op-antwoord,.p-Te-checken{background:var(--info-bg);color:var(--info)}
.p-neutral{background:var(--sand);color:var(--fg)}
.row.cancel .t{text-decoration:line-through;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.toolbar .chips{margin:0}

/* ---- hero next shoot ---- */
.next{background:var(--brown);color:#F6EDE3;border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:22px;cursor:pointer;border:0;width:100%;text-align:left}
.next .big{font-family:var(--display);font-size:44px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;min-width:64px}
.next .big small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-top:4px;font-weight:500}
.next .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.next .ttl{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.25;margin:2px 0}
.next .sub{font-size:13px;opacity:.85}

/* ---- tasks ---- */
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.task .tt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.addline{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.addline input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}

/* ---- calendar ---- */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:8px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:62px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;background:none;border-top:0;border-left:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--sand2);color:var(--muted)}
.day.blk{background:var(--sand)}
.day.blk.out{background:color-mix(in srgb,var(--sand) 60%,var(--sand2))}
.day .blkbar{display:block;height:4px;border-radius:2px;background:var(--muted);opacity:.55}
@media (min-width:700px){.day .blkbar{display:none}}
.day .n{font-size:12px;font-variant-numeric:tabular-nums;font-weight:500;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.day .ev{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.e-Bevestigd{background:var(--ok-bg);color:var(--ok)} .d-Bevestigd{background:var(--ok)}
.e-Gereserveerd{background:var(--warn-bg);color:var(--warn)} .d-Gereserveerd{background:var(--warn)}
.e-Afgerond{background:var(--done-bg);color:var(--done)} .d-Afgerond{background:var(--done)}
.e-Geannuleerd{background:var(--bad-bg);color:var(--bad);text-decoration:line-through} .d-Geannuleerd{background:var(--bad)}
.e-req{background:var(--info-bg);color:var(--info);border:1px dashed var(--info)} .d-req{background:var(--info)}
.newbox{background:var(--surface);border:2px solid var(--info);border-radius:var(--r);padding:4px 0;margin-bottom:22px;box-shadow:var(--shadow)}
.newbox h2{font-size:17px;padding:10px 14px 4px;display:flex;justify-content:space-between}
.e-blk{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
@media (min-width:700px){.day{min-height:104px}.day .ev{display:block}.dots{display:none}}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav .btn{padding:7px 12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---- chart ---- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 10px;overflow-x:auto;box-shadow:var(--shadow)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(34px,1fr));gap:6px;align-items:end;height:190px;min-width:450px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;cursor:pointer;background:none;border:0;padding:0}
.bar .val{font-size:10.5px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px;white-space:nowrap}
.bar .seg{border-radius:4px 4px 0 0;display:block}
.bar .seg.c{background:var(--accent)}
.bar .seg.r{background:color-mix(in srgb,var(--warn) 50%,var(--surface))}
.bar .seg+.seg{border-radius:0}
.bar[aria-pressed="true"] .val{color:var(--fg);font-weight:600}
.bar[aria-pressed="true"] .seg.c{background:var(--fg)}
.mlabels{display:grid;grid-template-columns:repeat(12,minmax(34px,1fr));gap:6px;min-width:450px;font-size:11px;color:var(--muted);text-align:center;padding-top:6px}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;padding:7px 16px;font-size:13px}
.hbar .tr{height:10px;background:var(--sand2);border-radius:5px;overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar b{font-variant-numeric:tabular-nums;font-weight:500}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:14px 16px;font-variant-numeric:tabular-nums}
.kv .tot{font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.kv .neg{color:var(--bad)} .kv .pos{color:var(--ok)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:70ch}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px;min-width:520px}
.tbl th,.tbl td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{border-top:0;font-weight:500;color:var(--muted);font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.tot td{font-weight:600;background:var(--sand2)}

/* ---- kennisbank ---- */
.kb{display:grid;gap:10px}
.kb details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 16px;box-shadow:var(--shadow)}
.kb summary{cursor:pointer;padding:14px 0;font-family:var(--display);font-size:17px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.kb summary::-webkit-details-marker{display:none}
.kb summary::after{content:"+";color:var(--muted);font-family:var(--body)}
.kb details[open] summary::after{content:"–"}
.kb .in{padding-bottom:16px;max-width:68ch}
.kb table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.kb td,.kb th{text-align:left;padding:7px 8px 7px 0;border-top:1px solid var(--line);vertical-align:top}
.kb th{font-weight:500;color:var(--muted);font-size:12px;border-top:0}
.kb ul{padding-left:18px;margin:6px 0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
.sw i{width:20px;height:20px;border-radius:6px;border:1px solid var(--line)}
.copy{background:var(--sand);border:0;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;margin-left:6px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.menu a,.menu button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.menu svg{width:22px;height:22px;color:var(--accent)}
.menu b{font-weight:500}
.menu span{font-size:12px;color:var(--muted)}

/* ---- sheets & forms ---- */
.scrim{position:fixed;inset:0;background:rgba(15,12,10,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.wide{max-width:820px}
@media (min-width:700px){.scrim{align-items:center;padding:20px}.sheet{border-radius:20px}}
.sheet h3{font-size:22px;margin-bottom:14px}
.sheet .sub{color:var(--muted);font-size:13px;margin:-10px 0 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full,.fsec{grid-column:1/-1}
.fsec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);width:100%;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.f.check{flex-direction:row;align-items:center;gap:8px}
.f.check input{width:20px;height:20px;accent-color:var(--accent)}
.f .hint{font-size:11.5px;color:var(--muted)}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:12px calc(4px + env(safe-area-inset-bottom,0px))}
.sheet .actions>div{display:flex;gap:8px;flex-wrap:wrap}
.newmenu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.newmenu button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.newmenu b{font-weight:500}.newmenu span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;white-space:nowrap}
@media (min-width:960px){.toast{bottom:28px}}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}

/* ---- invoice paper (always light, it's a printed document) ---- */
.paper-wrap{overflow-x:auto;margin:0 -4px;padding:4px}
.paper{background:#fff;color:#0F0F0F;border:1px solid #E4DACF;border-radius:6px;padding:32px;min-width:560px;font-family:"Poppins",system-ui,sans-serif;font-size:12px;line-height:1.5}

.p-team{background:var(--fg);color:var(--bg)}
.teamchecks{display:flex;flex-wrap:wrap;gap:8px}
.teamchecks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--fg)}
.teamchecks input{width:16px;height:16px;accent-color:var(--accent)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.12em;background:var(--sand2);border:1px dashed var(--line);border-radius:12px;padding:12px 16px;text-align:center;font-weight:600}
.msgbox{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.crew-wrap{max-width:640px;margin:0 auto}
.crew-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.prevbar{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.entry input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;letter-spacing:.1em;text-transform:uppercase;margin:12px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:440px){.fgrid{grid-template-columns:1fr}.ph h1{font-size:26px}.row{grid-template-columns:44px minmax(0,1fr) auto;gap:10px}.tile .v{font-size:23px}.next .big{font-size:36px}}
</style>

<body>

<div class="app">
  <nav class="side" aria-label="Hoofdmenu" id="nav"></nav>
  <main id="main"><div class="empty">Je headquarter laadt…</div></main>
</div>
<button class="fab" id="fab" aria-label="Nieuw toevoegen">+</button>

<script>
(function(){
/* ================= constants ================= */
const CO={naam:"Prime Moments",eig:"Hatice Kulak (eenmanszaak)",adres:"Pastoor Paquaylaan 164",plaats:"3550 Heusden, België",ond:"BE 1039.371.331",mail:"contact.primemoments@gmail.com",tel:"+32 468 37 10 09",iban:"BE39 7390 3465 9919",bic:"KREDBEBB",web:"primemoments.live"};
const COLS=["bookings","leads","tasks","partners","recurring","companies","invoices","purchases","inventory","blocks","team","swaps"];
const TEAM_URL=new URL("team/",location.href.split("#")[0]).href;
const S={settings:{drempel:{"2026":961.08,"2027":1922.16},usd:0.86}};COLS.forEach(c=>S[c]=[]);
const ICON={
 vandaag:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 boekingen:'<path d="M4 7h16v13H4zM9 7V4h6v3"/><path d="M8 12h8M8 16h5"/>',
 aanvragen:'<path d="M4 5h16v11H8l-4 4z"/>',
 klanten:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .8 3.2 2.6 3.5 5.2"/>',
 facturen:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 aankopen:'<path d="M3 4h2l2.5 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
 inventaris:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
 geld:'<path d="M17 6.5A6.5 6.5 0 1 0 17 17.5M4 10h9M4 14h9"/>',
 taken:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
 team:'<circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8M14 14.6c.8-.3 1.6-.4 2.5-.4 2.3 0 4.2 1.5 5 4.3"/>',
 partners:'<path d="M8 12l-3 3a2.5 2.5 0 0 0 3.5 3.5l1.5-1.5M16 12l3-3a2.5 2.5 0 0 0-3.5-3.5L14 7M9 15l6-6"/>',
 kennisbank:'<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v16H5.5A1.5 1.5 0 0 0 4 20.5zM4 20.5A1.5 1.5 0 0 0 5.5 22H20"/>',
 meer:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'
};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const NAV=[["Overzicht",[["vandaag","Vandaag"],["agenda","Agenda"]]],["Klanten & verkoop",[["aanvragen","Aanvragen"],["boekingen","Boekingen"],["klanten","Klanten"]]],["Administratie",[["facturen","Facturen"],["aankopen","Aankopen"],["inventaris","Inventaris"],["geld","Rapporten"]]],["Werk",[["team","Team"],["taken","Taken"],["partners","Partners"],["kennisbank","Kennisbank"]]]];
const MOBILE=["vandaag","agenda","boekingen","geld","meer"];
const MAAND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MAANDL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const DAG=["ma","di","wo","do","vr","za","zo"];

/* ================= helpers ================= */
let db=null,dl=null,canWrite=false,ready=false;
const UI={mode:"owner",preview:null,crewErr:"",view:"vandaag",bFilter:"komend",bSearch:"",year:null,month:null,cal:null,calSel:null,fFilter:"alle",aYear:null,lostOpen:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=(n,dec)=>"€ "+(+n||0).toLocaleString("nl-BE",{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});
const eur2=n=>eur(n,true);
const now=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const pd=s=>{if(!s||!/^\d{4}-\d\d-\d\d/.test(s))return null;const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
const dl_=s=>{const d=pd(s);return d?`${d.getDate()} ${MAAND[d.getMonth()]} ${d.getFullYear()}`:"–"};
const dShort=s=>{const d=pd(s);return d?`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`:"–"};
const daysTo=s=>{const d=pd(s);return d?Math.round((d-now())/864e5):null};
const addDays=(s,n)=>{const d=pd(s)||now();d.setDate(d.getDate()+n);return iso(d)};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const cls=s=>"p-"+String(s||"").replace(/\s+/g,"-");
const pill=(s,c)=>s?`<span class="pill ${c||cls(s)}">${esc(s)}</span>`:"";
const vid=b=>b.status==="Geannuleerd"?0:(+b.video||0);
const sorted=(L,k="datum")=>[...L].sort((a,b)=>(a[k]||"9999").localeCompare(b[k]||"9999"));
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}

/* ================= business logic ================= */
const toReceive=b=>{if(b.status==="Geannuleerd"||b.status==="Gereserveerd"||b.betaling==="Betaald"||b.betaling==="Te checken")return 0;return Math.max(0,vid(b)-(+b.ontvangen||0))};
function sameDay(b){if(!b.datum||b.status==="Geannuleerd")return [];return S.bookings.filter(o=>o.id!==b.id&&o.datum===b.datum&&o.status!=="Geannuleerd")}
function flags(b){const f=[];if(b.status==="Geannuleerd")return f;const dt=daysTo(b.datum);
  if(!b.datum)f.push("Datum ontbreekt");
  if(dt!==null&&dt<0&&b.status!=="Afgerond")f.push("Datum voorbij");
  if(dt!==null&&dt<0&&b.status==="Gereserveerd")f.splice(f.indexOf("Datum voorbij"),1,"Doorgegaan?");
  if(!b.video&&!b.gratis&&b.status!=="Geannuleerd")f.push("Prijs ontbreekt");
  if(b.betaling==="Te checken"&&dt!==null&&dt<0)f.push("Betaling nakijken");
  if(dt!==null&&dt>=0&&sameDay(b).length)f.push("2 shoots die dag");
  if(dt!==null&&dt>=0&&inBlock(b.datum))f.push("Valt in "+inBlock(b.datum).titel);
  return f}
function inBlock(ds){return S.blocks.find(k=>k.van&&ds>=k.van&&ds<=(k.tot||k.van))}
const invTotal=i=>Math.max(0,(i.regels||[]).reduce((a,r)=>a+(+r.bedrag||0),0)-(+i.korting||0));
function invStatus(i){if(i.status==="Betaald")return "Betaald";if(i.vervaldatum&&daysTo(i.vervaldatum)<0)return "Vervallen";return "Open"}
function deductible(p,year){const z=(p.zakelijk??100)/100;const amt=(+p.bedrag||0)*z;const y0=+(p.datum||"").slice(0,4);if(!y0)return 0;
  if(p.soort==="Investering"){const n=+p.jaren||3;return year>=y0&&year<y0+n?amt/n:0}return year===y0?amt:0}
function restwaarde(p,year){if(p.soort!=="Investering")return 0;const z=(p.zakelijk??100)/100;const amt=(+p.bedrag||0)*z;const y0=+(p.datum||"").slice(0,4);const n=+p.jaren||3;const done=Math.max(0,Math.min(n,year-y0+1));return amt-amt/n*done}
function warranty(it){if(!it.garantieTot)return "";const d=daysTo(it.garantieTot);if(d<0)return "Verlopen";if(d<90)return "Bijna verlopen";return "Loopt"}
function nextInvNr(year){const nums=S.invoices.filter(i=>(i.nummer||"").startsWith(year+"-")).map(i=>+i.nummer.split("-")[1]||0);return `${year}-${String((nums.length?Math.max(...nums):0)+1).padStart(3,"0")}`}

/* ================= navigation ================= */
function badge(v){if(!ready)return "";
  if(v==="vandaag"){const n=S.bookings.filter(b=>flags(b).length).length;return n||""}
  if(v==="facturen"){const n=S.invoices.filter(i=>invStatus(i)==="Vervallen").length;return n||""}
  if(v==="taken"){const n=S.tasks.filter(t=>!t.klaar).length;return n||""}
  if(v==="aanvragen"){const n=S.leads.filter(l=>["Nieuw"].includes(l.status)).length;return n||""}
  return ""}
function renderNav(){
  const cur=UI.view;const inMeer=!MOBILE.includes(cur);
  let h=`<div class="brand"><span class="logo">PRIMEMOMENTS<i></i></span><small>Headquarter</small></div>
  <button class="btn newbtn" data-act="new">+ Nieuw</button>`;
  NAV.forEach(([g,items])=>{h+=`<div class="grp">${g}</div>`;items.forEach(([k,l])=>{const mob=MOBILE.includes(k);h+=`<a class="nav-a${mob?"":" d-only"}" href="#${k}" ${cur===k?'aria-current="page"':""}>${ico(k)}<span>${k==="geld"?"<span class='m'>Geld</span>":l}</span><span class="cnt">${badge(k)}</span></a>`})});
  h+=`<button class="nav-a d-only" data-logout style="background:none;border:0;cursor:pointer;margin-top:auto;font:inherit">${ico("meer")}<span>Afmelden</span></button>`;
  h+=`<a class="nav-a m-only" href="#meer" ${inMeer?'aria-current="page"':""}>${ico("meer")}<span>Meer</span></a>`;
  $("#nav").innerHTML=h;
  // On desktop show "Rapporten" text; on phone "Geld"
  document.querySelectorAll("#nav .m").forEach(e=>e.textContent=matchMedia("(min-width:960px)").matches?"Rapporten":"Geld");
  // order on mobile: put tabs in MOBILE order
  if(!matchMedia("(min-width:960px)").matches){const n=$("#nav");MOBILE.forEach(k=>{const a=n.querySelector(`a[href="#${k}"]`);if(a)n.appendChild(a)})}
}

/* ================= row renderers ================= */
function rowB(b,opt={}){const d=pd(b.datum);const fl=opt.noFlags?[]:flags(b);
  return `<button class="row${b.status==="Geannuleerd"?" cancel":""}" data-edit="bookings:${b.id}">
   <div class="date${d?"":" none"}">${d?`<b>${d.getDate()}</b><span>${MAAND[d.getMonth()]}${d.getFullYear()!==now().getFullYear()?" '"+String(d.getFullYear()).slice(2):""}</span>`:`<b>?</b><span>datum</span>`}</div>
   <div class="main-t"><div class="t">${esc(b.klant)}${b.event?` <span style="color:var(--muted);font-weight:400">· ${esc(b.event)}</span>`:""}</div>
    <div class="d">${[b.start?(b.eind?`${esc(b.start)}–${esc(b.eind)}`:esc(b.start)):"",esc(b.locatie||"")].filter(Boolean).join(" · ")}</div>
    <div class="pills">${pill(b.status)}${teamChips(b)}${fl.map(f=>pill(f,"p-bad")).join("")}${b.betaling==="Betaald"?pill("Betaald"):b.betaling==="Voorschot"?pill("Voorschot"):""}${b.levering==="In montage"?pill("In montage","p-In-montage"):""}</div></div>
   <div class="amt">${b.video?eur(b.video):(b.gratis?"<small>gratis</small>":"–")}${b.foto?`<small>+ foto ${eur(b.foto)}</small>`:""}</div></button>`}
function rowInv(i){const st=invStatus(i);return `<button class="row" data-inv="${i.id}">
  <div class="date"><b style="font-size:15px">${esc((i.nummer||"").split("-")[1]||"?")}</b><span>${esc((i.nummer||"").split("-")[0]||"")}</span></div>
  <div class="main-t"><div class="t">${esc(i.klant)}</div><div class="d">${esc(i.type||"Factuur")} · ${dl_(i.datum)}${st!=="Betaald"&&i.vervaldatum?" · vervalt "+dl_(i.vervaldatum):""}</div><div class="pills">${pill(st)}</div></div>
  <div class="amt">${eur2(invTotal(i))}</div></button>`}
function rowP(p,year){return `<button class="row two" data-edit="purchases:${p.id}">
  <div class="main-t"><div class="t">${esc(p.leverancier)} <span style="color:var(--muted);font-weight:400">· ${esc(p.omschrijving||"")}</span></div>
  <div class="d">${dl_(p.datum)}${p.factuurnr?" · "+esc(p.factuurnr):""}${p.valuta&&p.valuta!=="EUR"?` · ${esc(p.valuta)} ${(+p.bedragOrig||0).toFixed(2)}`:""}</div>
  <div class="pills">${pill(p.categorie,"p-neutral")}${p.soort==="Investering"?pill(`Investering · ${p.jaren||3} jaar`,"p-info"):""}${p.zakelijk!=null&&+p.zakelijk<100?pill(p.zakelijk+"% zakelijk","p-warn"):""}${p.notitie&&/controle|vraag|check/i.test(p.notitie)?pill("Nakijken","p-bad"):""}</div></div>
  <div class="amt">${eur2(p.bedrag)}${p.soort==="Investering"?`<small>${year} aftrekbaar ${eur2(deductible(p,year))}</small>`:""}</div></button>`}

/* ================= views ================= */
const V={};
V.vandaag=()=>{
  const B=S.bookings,ym=iso(now()).slice(0,7),h=new Date().getHours();
  const groet=h<12?"Goeiemorgen":h<18?"Goeiemiddag":"Goeieavond";
  const up=sorted(B.filter(b=>{const d=daysTo(b.datum);return d!==null&&d>=0&&b.status!=="Geannuleerd"}));
  const nx=up[0];
  const maandV=B.filter(b=>(b.datum||"").startsWith(ym)).reduce((a,b)=>a+vid(b),0);
  const ontv=B.reduce((a,b)=>a+toReceive(b),0);
  const openInv=S.invoices.filter(i=>invStatus(i)!=="Betaald");
  const komend=up.filter(b=>daysTo(b.datum)<=21);
  const aandacht=sorted(B.filter(b=>flags(b).length));
  const montage=sorted(B.filter(b=>b.levering==="In montage"||(b.status==="Afgerond"&&b.levering==="Nog te filmen")));
  const vervallen=S.invoices.filter(i=>invStatus(i)==="Vervallen");
  const nxDays=nx?daysTo(nx.datum):null;
  const imp=!S.bookings.length&&!S.invoices.length?`<div class="entry" style="margin-bottom:22px"><h2 style="font-size:20px">Je gegevens importeren</h2><p class="note">Je HQ is nog leeg. Kies het bestand <b>PrimeMoments_HQ_gegevens.json</b> dat je van Claude kreeg. Dat moet maar één keer.</p><input type="file" id="importfile" accept=".json,application/json" style="font-family:var(--body);font-size:14px;text-transform:none;letter-spacing:0"></div>`:"";
  return imp+teamNews()+`<div class="ph"><div><div class="eyebrow">${new Date().toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div><h1>${groet}, Hatice</h1></div><div class="acts"><button class="btn" data-act="new">+ Nieuw</button></div></div>
  ${nx?`<button class="next" data-edit="bookings:${nx.id}"><div class="big">${nxDays===0?"Vandaag":nxDays}${nxDays===0?"":`<small>${nxDays===1?"dag":"dagen"}</small>`}</div>
   <div><div class="lbl">Volgende shoot · ${new Date(pd(nx.datum)).toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"})}</div><div class="ttl">${esc(nx.klant)}${nx.event?" · "+esc(nx.event):""}</div><div class="sub">${[nx.start?(nx.eind?nx.start+"–"+nx.eind:nx.start):"",nx.locatie||"",nx.fotograaf?"Fotograaf: "+nx.fotograaf:""].filter(Boolean).map(esc).join(" · ")||"Details aanvullen"}</div></div></button>`:""}
  <div class="tiles">
   <div class="tile dark"><div class="k">${cap(MAANDL[now().getMonth()])} · gepland video</div><div class="v">${eur(maandV)}</div><div class="s">${B.filter(b=>(b.datum||"").startsWith(ym)&&b.status!=="Geannuleerd").length} opdrachten</div></div>
   <div class="tile"><div class="k">Nog te ontvangen</div><div class="v">${eur(ontv)}</div><div class="s">uit bevestigde boekingen</div></div>
   <div class="tile ${vervallen.length?"bad":""}"><div class="k">Open facturen</div><div class="v">${eur(openInv.reduce((a,i)=>a+invTotal(i),0))}</div><div class="s">${openInv.length} open${vervallen.length?` · ${vervallen.length} vervallen`:""}</div></div>
   <div class="tile"><div class="k">Aanvragen in behandeling</div><div class="v">${S.leads.filter(l=>!["Geboekt","Verloren"].includes(l.status)).length}</div><div class="s"><a href="#aanvragen">bekijk pipeline</a></div></div>
  </div>
  <div class="cols"><div>
   <section class="block"><h2>Komende 3 weken <span class="meta">${komend.length} shoots · ${eur(komend.reduce((a,b)=>a+vid(b),0))}</span></h2>${komend.length?`<div class="list">${komend.map(b=>rowB(b)).join("")}</div>`:`<div class="empty">Geen shoots in de komende 3 weken.</div>`}</section>
   ${montage.length?`<section class="block"><h2>Nog te monteren <span class="meta">${montage.length}</span></h2><div class="list">${montage.map(b=>rowB(b,{noFlags:1})).join("")}</div></section>`:""}

V.agenda=()=>{

  const weeks=Math.ceil((off+new Date(y,m+1,0).getDate())/7);const td=iso(now());
  let cells="";
  for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d);
    const evs=sorted(S.bookings.filter(b=>b.datum===ds),"start");const bk=inBlock(ds);
    cells+=`<button class="day${d.getMonth()!==m?" out":""}${ds===td?" today":""}${bk?" blk":""}" data-day="${ds}" aria-pressed="${UI.calSel===ds}" aria-label="${d.getDate()} ${MAANDL[d.getMonth()]}, ${evs.length} boekingen">
     <span class="n">${d.getDate()}</span>
     ${bk?`<span class="ev e-blk">${esc(bk.titel)}</span><span class="blkbar"></span>`:""}
     ${openLeads().filter(l=>l.datum===ds).map(l=>`<span class="ev e-req">Aanvraag: ${esc(l.naam)}</span>`).join("")}
     ${evs.slice(0,3).map(b=>`<span class="ev e-${esc(b.status)}">${b.start?esc(b.start)+" ":""}${esc(b.klant)}</span>`).join("")}${evs.length>3?`<span class="ev" style="color:var(--muted)">+${evs.length-3} meer</span>`:""}
     <span class="dots">${evs.map(b=>`<i class="dot d-${esc(b.status)}"></i>`).join("")}${openLeads().filter(l=>l.datum===ds).map(()=>`<i class="dot d-req"></i>`).join("")}</span></button>`}
  const ym=`${y}-${String(m+1).padStart(2,"0")}`;
  const sel=UI.calSel;

  const bks=S.blocks.filter(k=>sel?(sel>=k.van&&sel<=(k.tot||k.van)):((k.van||"")<=ym+"-31"&&(k.tot||k.van||"")>=ym+"-01"));
  const total=S.bookings.filter(b=>(b.datum||"").startsWith(ym)).reduce((a,b)=>a+vid(b),0);
  const reqList=openLeads().filter(l=>sel?l.datum===sel:(l.datum||"").startsWith(ym));
  return `<div class="ph"><div><div class="eyebrow">Planning</div><h1>${cap(MAANDL[m])} ${y}</h1></div>
   <div class="acts cal-nav"><button class="btn ghost" data-cal="-1" aria-label="Vorige maand">‹</button><button class="btn ghost" data-cal="0">Vandaag</button><button class="btn ghost" data-cal="1" aria-label="Volgende maand">›</button><button class="btn" data-newb="${sel||""}">+ Boeking</button></div></div>
  <div class="cal"><div class="cal-head">${DAG.map(d=>`<span>${d}</span>`).join("")}</div><div class="cal-grid">${cells}</div></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>Bevestigd</span><span><i style="background:var(--warn)"></i>Gereserveerd</span><span><i style="background:var(--done)"></i>Afgerond</span><span><i style="background:var(--bad)"></i>Geannuleerd</span><span><i style="background:var(--sand);border:1px solid var(--line)"></i>Niet beschikbaar</span><span><i style="background:var(--info)"></i>Aanvraag</span></div>
  <section class="block" style="margin-top:22px"><h2>${sel?cap(new Date(pd(sel)).toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"})):"Deze maand"} <span class="meta">${sel?`<a href="#agenda" data-clearsel>toon hele maand</a>`:`${list.filter(b=>b.status!=="Geannuleerd").length} boekingen · ${eur(total)}`}</span></h2>
   ${bks.map(k=>`<div class="list" style="margin-bottom:10px"><button class="row two" data-edit="blocks:${k.id}"><div class="main-t"><div class="t">${esc(k.titel)}</div><div class="d">${dl_(k.van)} – ${dl_(k.tot||k.van)}${k.notitie?" · "+esc(k.notitie):""}</div></div><div class="amt">${pill("Niet beschikbaar","p-neutral")}</div></button></div>`).join("")}
   ${reqList.length?`<div class="list" style="margin-bottom:10px">${reqList.map(l=>`<button class="row two" data-edit="leads:${l.id}"><div class="main-t"><div class="t">Aanvraag: ${esc(l.naam)}${l.event?` <span style="color:var(--muted);font-weight:400">· ${esc(l.event)}</span>`:""}</div><div class="d">${[dl_(l.datum),l.start?l.start+(l.eind?"–"+l.eind:""):"",l.teamAanvraag?"van "+tName(l.bron):l.kanaal].filter(Boolean).map(esc).join(" · ")}</div></div><div class="amt">${pill(l.status||"Nieuw")}</div></button>`).join("")}</div>`:""}
   ${list.length?`<div class="list">${list.map(b=>rowB(b)).join("")}</div>`:`<div class="empty">${sel?`Niets gepland. <button class="btn sm" data-newb="${sel}" style="margin-left:6px">+ Boeking op deze dag</button>`:"Niets gepland deze maand."}</div>`}
   <div style="margin-top:12px"><button class="btn ghost sm" data-new="blocks">Dagen blokkeren</button></div></section>`};

const BF={komend:"Komend",gereserveerd:"Gereserveerd",aandacht:"Vraagt aandacht",montage:"Te monteren",afgerond:"Afgerond",geannuleerd:"Geannuleerd",alles:"Alles"};
V.boekingen=()=>{
  let L=S.bookings;const f=UI.bFilter;
  if(f==="komend")L=L.filter(b=>!["Geannuleerd","Afgerond"].includes(b.status)&&(daysTo(b.datum)===null||daysTo(b.datum)>=0));
  if(f==="gereserveerd")L=L.filter(b=>b.status==="Gereserveerd");
  if(f==="aandacht")L=L.filter(b=>flags(b).length);
  if(f==="montage")L=L.filter(b=>b.levering==="In montage"||(b.status==="Afgerond"&&b.levering==="Nog te filmen"));
  if(f==="afgerond")L=L.filter(b=>b.status==="Afgerond");
  if(f==="geannuleerd")L=L.filter(b=>b.status==="Geannuleerd");
  if(UI.bSearch){const q=UI.bSearch.toLowerCase();L=S.bookings.filter(b=>[b.klant,b.namen,b.event,b.locatie,b.notitie,b.contact,b.fotograaf].join(" ").toLowerCase().includes(q))}
  L=sorted(L);if(f==="afgerond"&&!UI.bSearch)L.reverse();
  const groups=[];L.forEach(b=>{const k=b.datum?b.datum.slice(0,7):"zzz";let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,items:[]});g.items.push(b)});
  const html=groups.map(g=>{const name=g.k==="zzz"?"Zonder datum":cap(MAANDL[+g.k.slice(5,7)-1])+" "+g.k.slice(0,4);
    return `<section class="block"><h2>${name} <span class="meta">${g.items.filter(b=>b.status!=="Geannuleerd").length} · ${eur(g.items.reduce((a,b)=>a+vid(b),0))}</span></h2><div class="list">${g.items.map(b=>rowB(b)).join("")}</div></section>`}).join("");
  return `<div class="ph"><div><div class="eyebrow">Klantenbestand · ${S.bookings.length} boekingen</div><h1>Boekingen</h1></div><div class="acts"><button class="btn ghost" data-csv="bookings">Exporteer</button><button class="btn" data-newb="">+ Boeking</button></div></div>
  <input class="search" id="bsearch" type="search" placeholder="Zoek op naam, event, locatie of contact" value="${esc(UI.bSearch)}" aria-label="Zoek boekingen">
  ${UI.bSearch?"":`<div class="chips">${Object.entries(BF).map(([k,v])=>`<button class="chip" data-bf="${k}" aria-pressed="${f===k}">${v}</button>`).join("")}</div>`}
  ${html||`<div class="empty">Geen boekingen in deze selectie.</div>`}`};

const LSTAT=["Nieuw","Offerte gestuurd","Wacht op antwoord","Geboekt","Verloren"];

  <p class="note">Elke DM of WhatsApp met een vraag voor een datum of offerte komt hier. Open een aanvraag en tik "Maak boeking" zodra ze vastleggen.</p>`};

function clientIndex(){const map={};const key=s=>(s||"").trim();
  S.bookings.forEach(b=>{const k=key(b.klant);if(!k)return;const o=map[k]=map[k]||{naam:k,bookings:[],invoices:[],contact:""};o.bookings.push(b);if(b.contact&&!o.contact)o.contact=b.contact});
  S.invoices.forEach(i=>{const k=Object.keys(map).find(n=>(i.klant||"").toLowerCase().includes(n.toLowerCase())||n.toLowerCase().includes((i.klant||"").toLowerCase().split(" (")[0]));const o=k?map[k]:(map[i.klant]=map[i.klant]||{naam:i.klant,bookings:[],invoices:[],contact:""});o.invoices.push(i)});
  return map}

  <section class="block"><h2>Bedrijfsgegevens <span class="meta">voor je facturen</span></h2>${S.companies.length?`<div class="list">${S.companies.map(c=>`<button class="row two" data-edit="companies:${c.id}"><div class="main-t"><div class="t">${esc(c.naam)}${c.handelsnaam?` <span style="color:var(--muted);font-weight:400">· ${esc(c.handelsnaam)}</span>`:""}</div><div class="d">${[c.adres,c.btw,c.contact,c.mail].filter(Boolean).map(esc).join(" · ")}</div>${!c.btw||!c.adres||c.adres.length<12?`<div class="pills">${pill("Gegevens aanvullen","p-warn")}</div>`:""}</div><div class="amt">${c.peppol==="Ja"?pill("Peppol","p-info"):""}</div></button>`).join("")}</div>`:`<div class="empty">Nog geen bedrijven.</div>`}</section>
  <section class="block"><h2>Alle klanten <span class="meta">${names.length}</span></h2><input class="search" id="ksearch" type="search" placeholder="Zoek klant" value="${esc(UI.kSearch||"")}" aria-label="Zoek klant"><div class="list">${shown.sort((a,b)=>a.localeCompare(b,"nl")).map(n=>{const o=map[n];const last=sorted(o.bookings).pop();return `<button class="row two" data-klant="${esc(n)}"><div class="main-t"><div class="t">${esc(n)}</div><div class="d">${o.bookings.length} ${o.bookings.length===1?"boeking":"boekingen"}${o.invoices.length?` · ${o.invoices.length} factuur`:""}${last&&last.datum?" · "+dl_(last.datum):""}${o.contact?" · "+esc(o.contact):""}</div></div><div class="amt">${eur(tot(n))}</div></button>`}).join("")}</div></section>`};

  const yr=UI.fYear||String(now().getFullYear());const years=[...new Set(S.invoices.map(i=>(i.datum||"").slice(0,4)).filter(Boolean).concat([String(now().getFullYear())]))].sort();

  <p class="note">Volgend nummer: <b>${nextInvNr(now().getFullYear())}</b>. Open een factuur om ze te bekijken, als betaald te markeren of als bestand te bewaren.</p>`};

const PCAT=["Camera & materiaal","Software","Website & domein","Administratie","Marketing","Kantoor","Verplaatsing","Opleiding","Overige"];
V.aankopen=()=>{
  const yr=+(UI.aYear||now().getFullYear());const years=[...new Set(S.purchases.map(p=>(p.datum||"").slice(0,4)).filter(Boolean).concat([String(now().getFullYear())]))].sort();
  const L=S.purchases.filter(p=>(p.datum||"").startsWith(String(yr))).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  const spent=L.reduce((a,p)=>a+(+p.bedrag||0),0);
  const ded=S.purchases.reduce((a,p)=>a+deductible(p,yr),0);
  const inv=L.filter(p=>p.soort==="Investering").reduce((a,p)=>a+(+p.bedrag||0),0);
  const byCat={};L.forEach(p=>byCat[p.categorie||"Overige"]=(byCat[p.categorie||"Overige"]||0)+(+p.bedrag||0));
  const mx=Math.max(1,...Object.values(byCat));
  const groups=[];L.forEach(p=>{const k=p.datum.slice(0,7);let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,items:[]});g.items.push(p)});
  return `<div class="ph"><div><div class="eyebrow">Kosten & investeringen</div><h1>Aankopen</h1></div><div class="acts"><button class="btn ghost" data-csv="purchases">Exporteer voor boekhouder</button><button class="btn" data-new="purchases">+ Aankoop</button></div></div>
  <div class="toolbar"><div class="chips">${years.map(y=>`<button class="chip" data-ay="${y}" aria-pressed="${+y===yr}">${y}</button>`).join("")}</div></div>
  <div class="tiles"><div class="tile dark"><div class="k">Uitgegeven ${yr}</div><div class="v">${eur2(spent)}</div><div class="s">${L.length} regels</div></div><div class="tile"><div class="k">Aftrekbaar ${yr}</div><div class="v">${eur2(ded)}</div><div class="s">kosten + afschrijving</div></div><div class="tile"><div class="k">Waarvan investeringen</div><div class="v">${eur2(inv)}</div><div class="s">afgeschreven over 3 jaar</div></div></div>
  <div class="cols"><div>${groups.map(g=>`<section class="block"><h2>${cap(MAANDL[+g.k.slice(5,7)-1])} <span class="meta">${eur2(g.items.reduce((a,p)=>a+(+p.bedrag||0),0))}</span></h2><div class="list">${g.items.map(p=>rowP(p,yr)).join("")}</div></section>`).join("")||`<div class="empty">Geen aankopen in ${yr}.</div>`}</div>
  <div><section class="block"><h2>Per categorie</h2><div class="list" style="padding:8px 0">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><span class="tr"><span style="width:${v/mx*100}%"></span></span><b>${eur(v)}</b></div>`).join("")||`<div class="hbar"><span style="color:var(--muted)">Nog niets</span></div>`}</div></section>
  <p class="note">Een aankoop die jaren meegaat (camera, lens, licentie) is een investering: per jaar trek je maar een deel af. De rest is gewone kost. Laat de keuze nakijken door je boekhouder.</p></div></div>`};

  const L=[...S.inventory].sort((a,b)=>(a.categorie||"").localeCompare(b.categorie||"")||(b.prijs||0)-(a.prijs||0));

    onSnapshot:(n,e)=>{(listeners[c]=listeners[c]||[]).push(n);load(c).catch(err=>e&&e(err));return()=>{}},
    get:async()=>{await load(c);return snapOf(c)},
    add:async o=>{const id=rid();chk(await sb.from("docs").insert({collection:c,id,data:o}));await load(c);return doc(c+"/"+id)},
    doc:id=>doc(c+"/"+id)}}
  return{collection,doc}}
dl={save:async({filename,data})=>{const b=new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"text/html;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return{status:"saved"}}};
function loginPage(msg){$("#nav").hidden=true;$("#fab").hidden=true;document.querySelector(".app").style.gridTemplateColumns="1fr";
  $("#main").innerHTML=`<div class="crew-wrap" style="max-width:420px;padding-top:6vh"><div class="crew-top"><span class="logo">PRIMEMOMENTS<i></i></span><span class="eyebrow" style="margin:0">Headquarter</span></div>
   <form class="entry" id="loginform"><h2 style="font-size:24px;margin-bottom:6px">Aanmelden</h2><p class="note" style="margin-top:0">Alleen voor Hatice.</p>
   <div class="f" style="margin-top:14px"><label for="l-mail">E-mail</label><input id="l-mail" type="email" autocomplete="username" required></div>
   <div class="f" style="margin-top:10px"><label for="l-pw">Wachtwoord</label><input id="l-pw" type="password" autocomplete="current-password" required minlength="8"></div>
   <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" name="mode" value="in">Aanmelden</button><button class="btn ghost" name="mode" value="up">Account aanmaken</button></div>
   ${msg?`<p class="note" style="color:var(--warn)">${esc(msg)}</p>`:""}</form></div>`;
  const f=$("#loginform");f.addEventListener("submit",async e=>{e.preventDefault();const mode=e.submitter&&e.submitter.value;const email=$("#l-mail").value.trim(),password=$("#l-pw").value;
    if(mode==="up"){const {error}=await SB.auth.signUp({email,password});return loginPage(error?error.message:"Account aangemaakt. Bevestig je e-mailadres via de mail van Supabase en meld je daarna hier aan. Laat Claude dan weten dat je account klaar is.")}
    const {error}=await SB.auth.signInWithPassword({email,password});if(error)return loginPage(error.message==="Invalid login credentials"?"E-mail of wachtwoord klopt niet.":error.message);start()})}
async function importFile(file){try{const j=JSON.parse(await file.text());const rows=(j.docs||[]).filter(r=>r.collection&&r.id&&r.data);toast("Importeren… "+rows.length+" items");
  for(let k=0;k<rows.length;k+=100){const {error}=await SB.from("docs").upsert(rows.slice(k,k+100));if(error)throw error}
  toast("Klaar: "+rows.length+" items geïmporteerd");COLS.forEach(c=>db.collection(c).get().catch(()=>{}))}catch(err){toast("Importeren mislukt: "+(err.message||err))}}
document.addEventListener("change",e=>{if(e.target.id==="importfile"&&e.target.files[0])importFile(e.target.files[0])});
document.addEventListener("click",async e=>{if(e.target.closest("[data-logout]")){await SB.auth.signOut();location.hash="";location.reload()}});
let started=false;
async function start(){const {data:{session}}=await SB.auth.getSession();if(!session)return loginPage();
  const {data:adm}=await SB.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!adm)return loginPage("Je bent aangemeld als "+session.user.email+", maar dit account heeft nog geen toegang. Laat Claude weten dat je account klaar is.");
  if(started)return;started=true;db=makeDb(SB);canWrite=true;UI.mode="owner";render();
  const pending=new Set(COLS);
  const done=c=>{pending.delete(c);if(!pending.size&&!ready)ready=true;rerender()};
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>Object.assign({id:x.id},x.data()));done(c)},()=>done(c)));
  db.doc("settings/finance").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},S.settings,s.data());rerender()},()=>{});
  db.doc("settings/team").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},S.settings,{teamCode:s.data().teamCode});rerender()},()=>{});
  setTimeout(()=>{if(!ready){ready=true;render()}},8000)}
start();
})();
</script>
